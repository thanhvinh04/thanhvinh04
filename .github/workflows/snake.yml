name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: thanhvinh04
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=#ffffff,#f8fbff,#dbeafe,#93c5fd,#60a5fa&color_snake=#2563eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60a5fa

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
