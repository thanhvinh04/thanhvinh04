name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: thanhvinh04
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=#ebedf0,#dbeafe,#93c5fd,#60a5fa,#2563eb&color_snake=#1d4ed8
            dist/github-contribution-grid-snake-dark.svg?palette=#161b22,#1f2937,#2563eb,#3b82f6,#60a5fa&color_snake=#93c5fd

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
