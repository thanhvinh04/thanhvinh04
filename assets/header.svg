<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Nguyen Thanh Vinh, Data Analytics Engineer. Between business and engineering. I build the systems behind the numbers. Scattered numbers flow into one source of truth, which turns into better decisions.">
<style>
.f{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.k{letter-spacing:1.6px}
.ring{animation:spin 14s linear infinite;transform-origin:930px 180px}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{animation:breathe 3s ease-in-out infinite;transform-origin:930px 180px}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.12)}}
.c1{animation:bob 3.6s ease-in-out infinite}
.c2{animation:bob 3.6s ease-in-out infinite;animation-delay:-1.2s}
.c3{animation:bob 3.6s ease-in-out infinite;animation-delay:-2.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.chart{stroke-dasharray:180;stroke-dashoffset:180;animation:draw 4s ease-out infinite}
@keyframes draw{0%{stroke-dashoffset:180}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@media (prefers-reduced-motion:reduce){.ring,.glow,.c1,.c2,.c3,.chart{animation:none}.chart{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset="0.5" stop-color="#1E1B4B"/><stop offset="1" stop-color="#0F4C4A"/></linearGradient>
<radialGradient id="gp" cx="0.02" cy="0" r="0.55"><stop offset="0" stop-color="#EC4899" stop-opacity="0.35"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
<radialGradient id="gt" cx="0.78" cy="0.5" r="0.45"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.35"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
<radialGradient id="ga" cx="0.35" cy="1.1" r="0.5"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.25"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/></pattern>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="0.55" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="core" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#99F6E4"/><stop offset="0.55" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0E7490"/></radialGradient>
<linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
<clipPath id="c"><rect width="1200" height="360" rx="22"/></clipPath>
</defs>

<g clip-path="url(#c)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#gp)"/>
<rect width="1200" height="360" fill="url(#gt)"/>
<rect width="1200" height="360" fill="url(#ga)"/>
<rect width="1200" height="360" fill="url(#dots)"/>
</g>

<!-- Left: who and why -->
<rect x="60" y="48" width="330" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.6"/>
<circle cx="80" cy="63" r="4" fill="#5EEAD4"/>
<text x="94" y="68" class="f k" font-size="12" font-weight="700" fill="#99F6E4">DATA ANALYTICS ENGINEER · SUPPLY CHAIN</text>
<text x="58" y="146" class="f" font-size="54" font-weight="800" fill="#FFFFFF">Nguyen Thanh Vinh</text>
<text x="60" y="202" class="f" font-size="24" font-weight="500" fill="#E2E8F0">Between business and engineering.</text>
<text x="60" y="238" class="f" font-size="24" font-weight="800" fill="url(#hl)">I build the systems behind the numbers.</text>
<rect x="60" y="262" width="64" height="4" rx="2" fill="#FBBF24"/>
<text x="60" y="298" class="f" font-size="16" fill="#C7D2FE">From messy operational problems to decisions people can trust.</text>

<!-- Right 1: scattered numbers -->
<g class="c1"><g transform="rotate(-4 728 87)">
<rect x="640" y="70" width="176" height="34" rx="10" fill="#FB7185" fill-opacity="0.16" stroke="#FB7185" stroke-opacity="0.75"/>
<text x="656" y="92" class="f" font-size="13.5" fill="#FECDD3">Which number is right?</text>
</g></g>
<g class="c2"><g transform="rotate(3 714 177)">
<rect x="626" y="160" width="176" height="34" rx="10" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.75"/>
<text x="642" y="182" class="f" font-size="13.5" fill="#FDE68A">Where's order #812?</text>
</g></g>
<g class="c3"><g transform="rotate(-2 734 267)">
<rect x="646" y="250" width="176" height="34" rx="10" fill="#FB7185" fill-opacity="0.16" stroke="#FB7185" stroke-opacity="0.75"/>
<text x="662" y="272" class="m" font-size="12.5" fill="#FECDD3">report_v7_final.xlsx</text>
</g></g>

<path id="p1" d="M818 88 C 850 88, 848 168, 874 174" fill="none" stroke="url(#flow)" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 5"/>
<path id="p2" d="M804 178 C 830 178, 846 180, 872 180" fill="none" stroke="url(#flow)" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 5"/>
<path id="p3" d="M824 266 C 856 266, 850 194, 874 186" fill="none" stroke="url(#flow)" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 5"/>
<circle r="4" fill="#FB7185"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="4" fill="#FBBF24"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle r="4" fill="#FB7185"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>

<!-- Right 2: one source of truth -->
<circle class="glow" cx="930" cy="180" r="66" fill="#2DD4BF" fill-opacity="0.35"/>
<circle class="ring" cx="930" cy="180" r="72" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="10 8"/>
<circle cx="930" cy="180" r="56" fill="url(#core)"/>
<text x="930" y="176" text-anchor="middle" class="f k" font-size="12.5" font-weight="800" fill="#042F2E">ONE SOURCE</text>
<text x="930" y="194" text-anchor="middle" class="f k" font-size="12.5" font-weight="800" fill="#042F2E">OF TRUTH</text>

<!-- Right 3: better decisions -->
<line x1="1002" y1="180" x2="1012" y2="180" stroke="#5EEAD4" stroke-width="2"/>
<rect x="1012" y="108" width="148" height="144" rx="14" fill="#2DD4BF" fill-opacity="0.16" stroke="#5EEAD4" stroke-opacity="0.8"/>
<text x="1028" y="132" class="f k" font-size="11" font-weight="700" fill="#99F6E4">DECISIONS</text>
<line x1="1028" y1="232" x2="1144" y2="232" stroke="#FFFFFF" stroke-opacity="0.15"/>
<line x1="1028" y1="204" x2="1144" y2="204" stroke="#FFFFFF" stroke-opacity="0.07"/>
<line x1="1028" y1="176" x2="1144" y2="176" stroke="#FFFFFF" stroke-opacity="0.07"/>
<polyline class="chart" points="1030,224 1052,214 1074,218 1096,194 1118,182 1142,152" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1142" cy="152" r="5" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="2.5"/>

<!-- Captions -->
<text x="728" y="324" text-anchor="middle" class="f k" font-size="11.5" font-weight="700" fill="#FDA4AF">CHASING NUMBERS</text>
<text x="840" y="324" text-anchor="middle" class="f" font-size="14" fill="#94A3B8">→</text>
<text x="930" y="324" text-anchor="middle" class="f k" font-size="11.5" font-weight="700" fill="#FCD34D">ONE SYSTEM</text>
<text x="1002" y="324" text-anchor="middle" class="f" font-size="14" fill="#94A3B8">→</text>
<text x="1092" y="324" text-anchor="middle" class="f k" font-size="11.5" font-weight="700" fill="#99F6E4">BETTER DECISIONS</text>
</svg>
