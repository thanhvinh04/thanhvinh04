<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Nguyen Thanh Vinh, Data Analytics Engineer. I don't just want to deliver a number. I want to build the thing that produces it.">
<style>
.f{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.k{letter-spacing:1.6px}
.d{animation:down 3.2s ease-in-out infinite}
@keyframes down{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(222px);opacity:0}}
.p{animation:pulse 2.4s ease-in-out infinite;transform-origin:800px 292px}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.d,.p{animation:none}.d{opacity:0}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1A2F"/><stop offset="1" stop-color="#123A5C"/></linearGradient>
<radialGradient id="g1" cx="0.85" cy="0.1" r="0.5"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.05" cy="1" r="0.55"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.20"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB7185"/><stop offset="0.35" stop-color="#FBBF24"/><stop offset="0.7" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
<clipPath id="c"><rect x="0" y="0" width="1200" height="340" rx="22"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#g1)"/>
<rect width="1200" height="340" fill="url(#g2)"/>
</g>

<rect x="60" y="52" width="330" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.5"/>
<circle cx="80" cy="67" r="4" fill="#2DD4BF"/>
<text x="94" y="72" class="f k" font-size="12" font-weight="700" fill="#5EEAD4">DATA ANALYTICS ENGINEER · SUPPLY CHAIN</text>

<text x="58" y="142" class="f" font-size="52" font-weight="800" fill="#FFFFFF">Nguyen Thanh Vinh</text>
<text x="60" y="196" class="f" font-size="24" font-weight="500" fill="#E2E8F0">I don't just want to deliver a number.</text>
<text x="60" y="230" class="f" font-size="24" font-weight="700" fill="url(#hl)">I want to build the thing that produces it.</text>
<rect x="60" y="254" width="56" height="3" rx="1.5" fill="#FBBF24"/>
<text x="60" y="286" class="f" font-size="16" fill="#9FB3C8">Close to business and operations, owning the engineering end to end.</text>

<line x1="800" y1="70" x2="800" y2="292" stroke="url(#ln)" stroke-width="2" stroke-dasharray="3 6"/>

<rect x="770" y="42" width="380" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FB7185" stroke-opacity="0.45"/>
<circle cx="800" cy="70" r="14" fill="#FB7185"/>
<text x="800" y="75" text-anchor="middle" class="f" font-size="13" font-weight="800" fill="#0A1A2F">1</text>
<text x="828" y="64" class="f k" font-size="11" font-weight="700" fill="#FDA4AF">THE PROBLEM</text>
<text x="828" y="85" class="f" font-size="16" fill="#F1F5F9">Teams chasing numbers by hand</text>

<rect x="770" y="116" width="380" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FBBF24" stroke-opacity="0.45"/>
<circle cx="800" cy="144" r="14" fill="#FBBF24"/>
<text x="800" y="149" text-anchor="middle" class="f" font-size="13" font-weight="800" fill="#0A1A2F">2</text>
<text x="828" y="138" class="f k" font-size="11" font-weight="700" fill="#FCD34D">UNDERSTAND</text>
<text x="828" y="159" class="f" font-size="16" fill="#F1F5F9">Where it breaks, and who it hurts</text>

<rect x="770" y="190" width="380" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#38BDF8" stroke-opacity="0.45"/>
<circle cx="800" cy="218" r="14" fill="#38BDF8"/>
<text x="800" y="223" text-anchor="middle" class="f" font-size="13" font-weight="800" fill="#0A1A2F">3</text>
<text x="828" y="212" class="f k" font-size="11" font-weight="700" fill="#7DD3FC">BUILD</text>
<text x="828" y="233" class="f" font-size="16" fill="#F1F5F9">A system that produces the number</text>

<circle class="p" cx="800" cy="292" r="20" fill="#2DD4BF"/>
<rect x="770" y="264" width="380" height="56" rx="14" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.7"/>
<circle cx="800" cy="292" r="14" fill="#2DD4BF"/>
<text x="800" y="297" text-anchor="middle" class="f" font-size="13" font-weight="800" fill="#0A1A2F">4</text>
<text x="828" y="286" class="f k" font-size="11" font-weight="700" fill="#5EEAD4">IMPACT</text>
<text x="828" y="307" class="f" font-size="16" font-weight="600" fill="#FFFFFF">Better decisions, hours given back</text>

<circle class="d" cx="800" cy="70" r="5" fill="#FFFFFF" opacity="0"/>
</svg>
