<text class="f" font-size="14" fill="#CBD5E1"><tspan x="632" y="400">production scans turned</tspan><tspan x="632" y="421">into history people can use</tspan></text>

<rect x="885" y="318" width="255" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.04"/>
<text x="907" y="370" class="f" font-size="38" font-weight="800" fill="#FB7185">3.95</text>
<text class="f" font-size="14" fill="#CBD5E1"><tspan x="907" y="400">GPA, BSc Data Science</tspan><tspan x="907" y="421">at UEH, 2022 – 2025</tspan></text>
