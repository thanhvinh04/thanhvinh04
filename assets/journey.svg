<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Journey. Transcosmos Vietnam, Data Scientist Intern, 2024: helped turn e-commerce reviews into signals brands can act on. Asia Flames, Data Analyst Intern, 2025: gave marketing, HR and accounting a clear view of what works. Lucky Star Vietnam, Data Analytics Engineer, 2025 to 2026: made every order traceable so planners stop chasing updates. PNJ Group, Data Analytics Engineer, 2026 to now: giving Supply Chain a system it can run and grow on. Impact: about 12 hours a week given back to planners, about 90 percent fewer manual follow-ups, about 200 million scan records turned into usable history, GPA 3.95.">
<style>
.f{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.k{letter-spacing:1.4px}
.p{animation:pulse 2.4s ease-in-out infinite;transform-origin:1012.5px 52px}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.6;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.p{animation:none}}
</style>
<defs>
