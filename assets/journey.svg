<linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.35" stop-color="#FBBF24"/><stop offset="0.65" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
<clipPath id="c"><rect width="1200" height="480" rx="22"/></clipPath>
</defs>
